# Production overrides for docker-compose.yml
# This file extends the base docker-compose.yml with production-specific settings

services:
  postgres:
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anime} -d ${POSTGRES_DB:-anime}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    restart: "no"
    pull_policy: always

  api:
    restart: always
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  web:
    restart: always
    pull_policy: always
    environment:
      NODE_ENV: production
      API_URL: ${API_URL:-https://watch.awebm.cc/api/v1}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  bot:
    restart: always
    pull_policy: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  proxy:
    profiles: ["proxy"]
    image: caddy:2.8.4-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: watch.awebm.cc
      ACME_EMAIL: admin@watch.awebm.cc
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local