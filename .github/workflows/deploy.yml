name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Self-Hosted Runner
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
      IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

      - name: Stop existing containers
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true

      - name: Deploy with docker compose
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
          DEV_AUTH_ENABLED: ${{ secrets.DEV_AUTH_ENABLED }}
          DEV_AUTH_TELEGRAM_ID: ${{ secrets.DEV_AUTH_TELEGRAM_ID }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ALLOWED_PROVIDERS: ${{ secrets.ALLOWED_PROVIDERS }}
          PROVIDER_TIMEOUT: ${{ secrets.PROVIDER_TIMEOUT }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_DEV_AUTH_ENABLED: ${{ vars.NEXT_PUBLIC_DEV_AUTH_ENABLED }}
          NEXT_PUBLIC_DEV_AUTH_TELEGRAM_ID: ${{ vars.NEXT_PUBLIC_DEV_AUTH_TELEGRAM_ID }}
          API_PORT: ${{ vars.API_PORT }}
          WEB_PORT: ${{ vars.WEB_PORT }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

      - name: Run migrations
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T migrate alembic upgrade head

      - name: Health check
        run: |
          sleep 10
          curl -fsS http://localhost:${{ vars.API_PORT }}/health/live || exit 1
          curl -fsS http://localhost:${{ vars.WEB_PORT }}/api/health || exit 1

      - name: Cleanup old images
        run: |
          docker image prune -f --filter "until=24h"