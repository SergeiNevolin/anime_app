name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "uv"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run MyPy
        run: uv run mypy

      - name: Run Tests
        run: uv run pytest -v --cov=src/anime_app --cov-report=xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API Types
        run: pnpm generate:api

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeCheck
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Run E2E Tests
        uses: ./.github/actions/e2e
        if: false
        with:
          playwright-version: "1.65.1"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend