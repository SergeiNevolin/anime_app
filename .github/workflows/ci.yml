name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U anime -d anime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://anime:anime@localhost:5432/anime
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run MyPy
        run: uv run mypy

      - name: Run Unit & Contract Tests
        run: uv run pytest -v tests/unit tests/contract --cov=src/anime_app --cov-report=xml

      # - name: Run Integration Tests
      #   run: uv run pytest -v tests/integration --cov=src/anime_app --cov-report=xml --cov-append

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.9"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Generate API Types
        run: pnpm generate:api
        working-directory: ./frontend

      - name: Run ESLint
        run: pnpm lint
        working-directory: ./frontend

      - name: Run TypeCheck
        run: pnpm typecheck
        working-directory: ./frontend

      - name: Run Unit Tests
        run: pnpm test
        working-directory: ./frontend

      - name: Run E2E Tests
        uses: ./.github/actions/e2e
        if: false
        with:
          playwright-version: "1.65.1"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend