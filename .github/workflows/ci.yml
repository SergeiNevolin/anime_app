name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # TESTS (run in parallel)
  # =========================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U anime -d anime"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://anime:anime@localhost:5432/anime
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: development
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run MyPy
        run: uv run mypy

      - name: Run Unit & Contract Tests
        run: uv run pytest -v tests/unit tests/contract --cov=src/anime_app --cov-report=xml

      # - name: Run Integration Tests
      #   run: uv run pytest -v tests/integration --cov=src/anime_app --cov-report=xml --cov-append

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.34.9"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Generate API Types
        run: pnpm generate:api
        working-directory: ./frontend

      - name: Run ESLint
        run: pnpm lint
        working-directory: ./frontend

      - name: Run TypeCheck
        run: pnpm typecheck
        working-directory: ./frontend

      - name: Run Unit Tests
        run: pnpm test
        working-directory: ./frontend

      - name: Run E2E Tests
        uses: ./.github/actions/e2e
        if: false
        with:
          playwright-version: "1.65.1"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend

  # =========================================================================
  # BUILD (run after tests pass)
  # =========================================================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ./backend
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anime-app/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `format=long` makes the tag the full 40-character SHA, which is
            # exactly what the deploy job passes as IMAGE_TAG.
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ./frontend
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/anime-app/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `format=long` makes the tag the full 40-character SHA, which is
            # exactly what the deploy job passes as IMAGE_TAG.
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # DEPLOY (run after build succeeds)
  # =========================================================================
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    environment: production
    permissions:
      contents: read
      packages: read
    # The images built by this run are tagged with the commit SHA, so the host
    # pulls exactly the revision that passed the tests instead of re-tagging
    # and rebuilding whatever `latest` happens to point at.
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker compose -p anime-watch -f docker-compose.yml -f docker-compose.prod.yml --profile proxy pull migrate api web bot

      - name: Stop existing containers
        run: |
          docker compose -p anime-watch -f docker-compose.yml -f docker-compose.prod.yml --profile proxy down || true

      - name: Deploy with docker compose
        run: |
          docker compose -p anime-watch -f docker-compose.yml -f docker-compose.prod.yml --profile proxy up -d --remove-orphans --pull always

      # - name: Run migrations
      #   run: |
      #     docker compose -p anime-watch -f docker-compose.yml -f docker-compose.prod.yml exec -T migrate alembic upgrade head

      # - name: Health check
      #   run: |
      #     sleep 10
      #     curl -fsS http://localhost:8000/health/live || exit 1
      #     curl -fsS http://localhost:3000/api/health || exit 1

      - name: Cleanup old images
        run: |
          docker image prune -f
