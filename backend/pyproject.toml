[project]
name = "anime-watch-api"
version = "0.1.0"
description = "Backend API for the Anime Watch Telegram Mini App"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.162.7",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "anicli-api==0.12.0",
    "aiogram==3.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[project.scripts]
anime-watch-api = "anime_app.main:run"
anime-watch-bot = "anime_app.bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_app"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a running PostgreSQL instance",
    "contract: contract tests for infrastructure adapters",
]
filterwarnings = [
    "ignore::DeprecationWarning:anicli_api.*",
]

[tool.coverage.run]
source = ["src/anime_app"]
branch = true
omit = [
    "src/anime_app/bot/*",
    "src/anime_app/main.py",
    "src/anime_app/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "SIM",
    "RUF",
    "ASYNC",
    "S",
    "N",
    "ANN",
    "D",
    "TID",
    "PTH",
    "ARG",
    "PL",
    "TRY",
    "EM",
    "BLE",
]
ignore = [
    "D203",
    "D213",
    "ANN401",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "TRY003",
    "TRY300",
    "EM101",
    "EM102",
    "D107",
    "D401",
    "ARG002",
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S", "PLR", "ARG", "N802", "PLC0415", "F401", "F821", "F841", "RUF001", "RUF003"]
"src/anime_app/main.py" = ["D"]
"src/anime_app/bot/**" = ["D"]
"src/anime_app/api/**" = ["ARG001"]
"src/anime_app/config.py" = ["S104"]
"src/anime_app/infrastructure/providers/fixtures/**" = ["RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["anime_app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
files = ["src/anime_app"]
plugins = []
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["anicli_api.*", "aiogram.*", "redis.*", "asyncpg.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["anime_app.bot.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
